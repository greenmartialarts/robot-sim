<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FRC Swerve Robot Simulation</title>
  <style>
    /* ── Reset ── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      overflow: hidden;
      background: #111;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #fff;
    }

    canvas { display: block; }

    /* ── Loading screen ── */
    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111;
      transition: opacity 0.6s ease;
    }
    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #loading-screen h1 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: #3B82F6;
    }
    #loading-bar-container {
      width: 300px;
      height: 8px;
      border-radius: 4px;
      background: #333;
      overflow: hidden;
    }
    #loading-bar {
      height: 100%;
      width: 0%;
      background: #3B82F6;
      border-radius: 4px;
      transition: width 0.3s ease;
    }
    #loading-text {
      margin-top: 0.5rem;
      font-size: 0.85rem;
      color: #888;
    }

    /* ── HUD overlay ── */
    #hud {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .hud-card {
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(59, 130, 246, 0.4);
      border-radius: 8px;
      padding: 10px 16px;
      backdrop-filter: blur(8px);
      font-size: 0.9rem;
    }
    .hud-card .label {
      color: #888;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .hud-card .value {
      font-size: 1.3rem;
      font-weight: 700;
      color: #3B82F6;
    }

    /* ── Controls help ── */
    #controls-help {
      position: fixed;
      bottom: 16px;
      left: 16px;
      z-index: 10;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 12px 16px;
      backdrop-filter: blur(8px);
      font-size: 0.75rem;
      line-height: 1.6;
      color: #aaa;
    }
    #controls-help kbd {
      display: inline-block;
      background: #333;
      border: 1px solid #555;
      border-radius: 3px;
      padding: 1px 5px;
      font-family: monospace;
      font-size: 0.7rem;
      color: #ddd;
    }

    /* ── Camera label ── */
    #camera-label {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 10;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(59, 130, 246, 0.4);
      border-radius: 8px;
      padding: 8px 14px;
      backdrop-filter: blur(8px);
      font-size: 0.85rem;
      color: #3B82F6;
    }
  </style>
</head>
<body>
  <!-- Loading screen -->
  <div id="loading-screen">
    <h1>FRC Swerve Sim</h1>
    <div id="loading-bar-container">
      <div id="loading-bar"></div>
    </div>
    <p id="loading-text">Initializing...</p>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div class="hud-card">
      <div class="label">Fuel</div>
      <div class="value" id="hud-balls">0 / 1</div>
    </div>
    <div class="hud-card">
      <div class="label">Shots Made</div>
      <div class="value" id="hud-shots">0</div>
    </div>
  </div>

  <!-- Camera label -->
  <div id="camera-label">Driver Station</div>

  <!-- Controls help -->
  <div id="controls-help">
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move &nbsp;|&nbsp;
    <kbd>Q</kbd><kbd>E</kbd> Rotate &nbsp;|&nbsp;
    <kbd>Space</kbd> Shoot &nbsp;|&nbsp;
    <kbd>Mouse</kbd> Look &nbsp;|&nbsp;
    <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd><kbd>5</kbd><kbd>6</kbd><kbd>7</kbd><kbd>8</kbd> Camera &nbsp;|&nbsp;
    <kbd>R</kbd> Reset
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
